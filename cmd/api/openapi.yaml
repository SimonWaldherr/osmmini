openapi: 3.1.0
info:
  title: osmmini routerd API
  version: "1.0.0"
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/status:
    get:
      summary: Status and graph stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/v1/settings:
    get:
      summary: Get settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      summary: Update settings
      description: "Unauthenticated by default. If the server is started with -admin-token (or OSMMINI_ADMIN_TOKEN), a matching Authorization: Bearer token header is required."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tinytiles/build:
    get:
      summary: Get local tinyTiles build status
      responses:
        "200":
          description: Current build state; contains no local filesystem paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TinyTilesBuildStatus"
    post:
      summary: Build or replace the local tinyTiles artifact from the loaded PBF
      description: Requires the same administrator token as settings updates. The request starts an asynchronous build and returns immediately.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TinyTilesBuildRequest"
      responses:
        "202":
          description: Build accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TinyTilesBuildStatus"
        "400":
          description: Invalid zoom range or unavailable PBF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid administrator token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another build is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/offline-labels:
    get:
      summary: Get local town and street labels for the tinyTiles map
      description: Labels are read from the locally loaded PBF data. They are intended for the current viewport and do not require an external font or tile service.
      parameters:
        - name: bbox
          in: query
          required: true
          description: Visible WGS84 bounds as minLon,minLat,maxLon,maxLat.
          schema: { type: string }
        - name: zoom
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 22 }
      responses:
        "200":
          description: Local labels for the requested viewport
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        lat: { type: number }
                        lon: { type: number }
                        kind: { type: string, enum: [place, road] }
        "400":
          description: Invalid bounding box
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tile-sources:
    get:
      summary: List built-in map-source presets
      responses:
        "200":
          description: Map-source presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TileSourcePreset"
  /api/v1/territories:
    get:
      summary: List territory layers loaded from the optional territories directory
      responses:
        "200":
          description: Loaded layers and their territory counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  layers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        territories: { type: integer, minimum: 0 }
  /api/v1/territories/{layer}:
    get:
      summary: Get one loaded territory layer as GeoJSON
      parameters:
        - name: layer
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Original GeoJSON FeatureCollection
          content:
            application/geo+json:
              schema: { type: object }
        "404":
          description: Unknown territory layer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/search:
    get:
      summary: Address and street search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /api/v1/route:
    post:
      summary: Route between two locations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/trip/solve:
    post:
      summary: Solve a trip (multi-stop) optionally optimized (TSP) with dependencies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripSolveRequest"
      responses:
        "200":
          description: Trip solution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSolveResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/openapi.yaml:
    get:
      summary: OpenAPI spec
      responses:
        "200":
          description: YAML
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Tags:
      type: object
      additionalProperties: { type: string }
    Coord:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
    Location:
      type: object
      properties:
        query: { type: string }
        lat: { type: number }
        lon: { type: number }
    ProWeights:
      type: object
      properties:
        left_turn: { type: number }
        right_turn: { type: number }
        u_turn: { type: number }
        crossing: { type: number }
        max_speed_kph: { type: number }
        vehicle_height_m: { type: number }
        vehicle_weight_t: { type: number }
    RouteOptions:
      type: object
      properties:
        engine:
          type: string
          enum: [astar, dijkstra]
        objective:
          type: string
          enum: [distance, duration, economy]
        pro: { type: boolean }
        weights:
          $ref: "#/components/schemas/ProWeights"
    RouteRequest:
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/Location" }
        to: { $ref: "#/components/schemas/Location" }
        options: { $ref: "#/components/schemas/RouteOptions" }
    RoutePoint:
      type: object
      properties:
        input: { type: string }
        label: { type: string }
        lat: { type: number }
        lon: { type: number }
        node: { type: integer }
        snap_m: { type: number }
    RouteResponse:
      type: object
      properties:
        from: { $ref: "#/components/schemas/RoutePoint" }
        to: { $ref: "#/components/schemas/RoutePoint" }
        engine: { type: string }
        objective: { type: string }
        cost: { type: number }
        distance_m: { type: number }
        duration_s: { type: number }
        path:
          type: array
          items: { $ref: "#/components/schemas/Coord" }
        google_maps_url: { type: string }
        apple_maps_url: { type: string }
    SearchResult:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [address, street] }
        label: { type: string }
        lat: { type: number }
        lon: { type: number }
        tags: { $ref: "#/components/schemas/Tags" }
    TripStop:
      type: object
      properties:
        id: { type: string }
        location: { $ref: "#/components/schemas/Location" }
    Dependency:
      type: object
      properties:
        before: { type: string }
        after: { type: string }
    TripPlan:
      type: object
      properties:
        start: { $ref: "#/components/schemas/Location" }
        end: { $ref: "#/components/schemas/Location" }
        stops:
          type: array
          items: { $ref: "#/components/schemas/TripStop" }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/Dependency" }
        optimize: { type: boolean }
        loop: { type: boolean }
    TripSolveRequest:
      type: object
      properties:
        plan: { $ref: "#/components/schemas/TripPlan" }
        options: { $ref: "#/components/schemas/RouteOptions" }
    TripStopResolved:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        lat: { type: number }
        lon: { type: number }
        node: { type: integer }
        snap_m: { type: number }
    TripSolveResponse:
      type: object
      properties:
        engine: { type: string }
        objective: { type: string }
        order:
          type: array
          items: { type: string }
        stops:
          type: array
          items: { $ref: "#/components/schemas/TripStopResolved" }
        distance_m: { type: number }
        duration_s: { type: number }
        cost: { type: number }
        path:
          type: array
          items: { $ref: "#/components/schemas/Coord" }
        legs:
          type: array
          items: { $ref: "#/components/schemas/RouteResponse" }
        google_maps_url: { type: string }
        apple_maps_url: { type: string }
    Settings:
      type: object
      properties:
        routing: { $ref: "#/components/schemas/RouteOptions" }
        tiles:
          type: object
          properties:
            cache_dir: { type: string }
            upstream: { type: string }
            user_agent: { type: string }
            map_type: { type: string, enum: [raster, raster-direct, vector, wms] }
            style_url: { type: string, format: uri-reference }
            wms_layers: { type: string }
            attribution: { type: string }
            max_zoom: { type: integer, minimum: 0, maximum: 22 }
            mem_cache_size: { type: integer, minimum: 0 }
    TileSourcePreset:
      type: object
      required: [id, label, map_type, attribution]
      properties:
        id: { type: string }
        label: { type: string }
        map_type: { type: string, enum: [raster, raster-direct, vector, wms] }
        upstream: { type: string }
        style_url: { type: string, format: uri-reference }
        wms_layers: { type: string }
        attribution: { type: string }
        max_zoom: { type: integer, minimum: 0, maximum: 22 }
    TinyTilesBuildRequest:
      type: object
      properties:
        min_zoom: { type: integer, minimum: 5, maximum: 14, default: 5 }
        max_zoom: { type: integer, minimum: 5, maximum: 14, default: 14 }
        postal_codes:
          type: boolean
          default: false
          description: Also extract OSM boundary=postal_code relations and publish a PLZ territory layer.
        postal_prefix_length:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: PLZ prefix length used when postal_codes is true.
    TinyTilesBuildStatus:
      type: object
      required: [state, phase, progress]
      properties:
        state: { type: string, enum: [idle, building, ready, failed] }
        phase:
          type: string
          enum: [idle, preparing, generating, importing, finalizing, activating, territories, processing, ready, failed]
          description: Public build phase; does not expose local paths or tinyTiles internals.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Monotonic overall build progress. During the importing phase it follows the completed tinyTiles import rows.
        message: { type: string }
        error: { type: string, description: Public, path-free failure message }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        artifact: { type: string, description: Artifact file name only }
        min_zoom: { type: integer }
        max_zoom: { type: integer }
        postal_codes: { type: boolean }
        postal_prefix_length: { type: integer, minimum: 1, maximum: 5 }
        territory_layer: { type: string, example: plz3 }
        territories: { type: integer, minimum: 0 }
        source_bytes: { type: integer, format: int64, minimum: 0, description: Size of the source PBF in bytes. }
        estimated_disk_bytes: { type: integer, format: int64, minimum: 0, description: Preflight estimate for the published artifact. }
        estimated_tile_count: { type: integer, format: int64, minimum: 0, description: Tile count estimated during tinySQL preflight. }
        generated_tiles: { type: integer, minimum: 0, description: Number of tiles generated from the PBF. }
        road_features: { type: integer, minimum: 0, description: Number of road features used by the generated map. }
