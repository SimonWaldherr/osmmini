openapi: 3.1.0
info:
  title: osmmini routerd API
  version: "1.0.0"
servers:
  - url: /
paths:
  /api/v1/dispatch/plan:
    post:
      summary: Allocate jobs to vehicles or teams with capacity, skills and territory rules
      description: Stateless priority-greedy heuristic using great-circle distance from each resource location. No PBF is needed unless routing manifests afterwards. Does not compute routes, stop order, time windows or a globally optimal allocation. Same public access policy as routing; request body limited to 4 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resources:
                  type: array
                  maxItems: 256
                  items: { $ref: '#/components/schemas/WorkResource' }
                jobs:
                  type: array
                  maxItems: 5000
                  items: { $ref: '#/components/schemas/WorkJob' }
                layer: { type: string, description: Optional loaded territory layer; unknown layers are rejected }
                vehicle_key: { type: string, default: territory_id, description: Resource property holding the territory ID; requires layer }
      responses:
        '200':
          description: Deterministic resource manifests and explicit reasons for all unassigned jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkPlan' }
        '400': { description: Invalid JSON, input limits, unknown layer or invalid planning data }
        '405': { description: POST required }
  /api/v1/geo/pois:
    get:
      summary: Local POIs as GeoJSON Points (nodes and way centroids)
      description: Supply bbox OR lat/lon/radius_m. Radius results are ordered by great-circle distance. Includes matched and truncated metadata; limit caps the export. Relations are not included.
      parameters:
        - { name: bbox, in: query, schema: { type: string }, description: 'minLon,minLat,maxLon,maxLat; non-wrapping WGS84 box' }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radius_m, in: query, schema: { type: number, exclusiveMinimum: 0, maximum: 100000 } }
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, description: 'Canonical category or German/English alias (e.g. hospital, Krankenhäuser), raw POI tag value, or exact key=value filter (e.g. amenity=hospital). Semantic categories include alternative tag combinations; qualified filters do not.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200':
          description: GeoJSON FeatureCollection; coordinates are longitude then latitude
          content:
            application/geo+json:
              schema:
                type: object
                required: [type, features, matched, truncated]
                properties:
                  type: { type: string, const: FeatureCollection }
                  features: { type: array, items: { type: object } }
                  matched: { type: integer }
                  truncated: { type: boolean }
        '400': { description: Invalid or conflicting spatial parameters }
        '503': { description: POI index still loading }
  /api/v1/geo/measure:
    post:
      summary: Measure a polyline using great-circle segment distances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coordinates]
              properties:
                coordinates:
                  type: array
                  minItems: 2
                  maxItems: 10000
                  items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
      responses:
        '200':
          description: Spherical measurement in metres (not road distance or an ellipsoidal survey)
          content:
            application/json:
              schema:
                type: object
                properties:
                  length_m: { type: number }
                  segments_m: { type: array, items: { type: number } }
                  model: { type: string, const: sphere }
                  earth_radius_m: { type: number, const: 6371000 }
        '400': { description: Invalid coordinates or point count }
  /api/v1/health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /api/v1/status:
    get:
      summary: Status and graph stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/v1/operations:
    get:
      summary: List local delivery, maintenance and check records
      description: Requires an operator bearer token in multi-user mode or the configured admin token in single-user mode. Unavailable in browser-local mode.
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [pod, maintenance, check] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: Newest records first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperationRecord" }
        "401": { description: Authentication required }
        "503": { description: Operations log unavailable }
    post:
      summary: Create or retry an operation
      description: Supply a stable client_event_id for retries. An identical retry returns the original record; a different payload or operator using the same ID receives 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationRecord" }
      responses:
        "201":
          description: Created record or original record for an identical retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationRecord" }
        "400": { description: Invalid operation }
        "401": { description: Authentication required }
        "409": { description: Client event ID conflicts with another operation }
        "503": { description: Operations log unavailable }
  /api/v1/settings:
    get:
      summary: Get settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      summary: Update settings
      description: "Unauthenticated by default. If the server is started with -admin-token (or OSMMINI_ADMIN_TOKEN), a matching Authorization: Bearer token header is required."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tinytiles/build:
    get:
      summary: Get local tinyTiles build status
      responses:
        "200":
          description: Current build state; contains no local filesystem paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TinyTilesBuildStatus"
    post:
      summary: Build or replace the local tinyTiles artifact from the loaded PBF
      description: Requires the same administrator token as settings updates. The request starts an asynchronous build and returns immediately.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TinyTilesBuildRequest"
      responses:
        "202":
          description: Build accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TinyTilesBuildStatus"
        "400":
          description: Invalid zoom range or unavailable PBF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid administrator token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another build is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tinytiles/waterways:
    get:
      summary: Get local river, canal, and stream geometry for the current offline-map viewport
      description: Returns clipped GeoJSON from the tinyTiles waterway companion sidecar. It is available only after an offline map build and is intentionally bounded to the requested viewport.
      parameters:
        - name: bbox
          in: query
          required: true
          description: Visible WGS84 bounds as minLon,minLat,maxLon,maxLat.
          schema: { type: string }
        - name: zoom
          in: query
          required: false
          description: Current map zoom; controls which waterway classes are returned.
          schema: { type: integer, minimum: 0, maximum: 22 }
      responses:
        "200":
          description: GeoJSON waterway features clipped to the requested viewport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TinyTilesWaterwayFeatureCollection"
        "400":
          description: Invalid bounding box
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tinytiles/buildings:
    get:
      summary: Get offline building footprints and estimated heights for the visible map
      description: Returns complete closed-way polygons intersecting the viewport from zoom 14. Heights use OSM height, then building levels at 3 metres per level, then type-specific defaults. Responses are limited to 3000 buildings and 100000 vertices. Large viewports are rejected. Estimated heights are identified by height_source.
      parameters:
        - name: bbox
          in: query
          required: true
          description: Visible WGS84 bounds as minLon,minLat,maxLon,maxLat.
          schema: { type: string }
        - name: zoom
          in: query
          schema: { type: integer, minimum: 0, maximum: 22 }
      responses:
        "200":
          description: GeoJSON building polygons; an empty collection when unavailable or below zoom 14
          content:
            application/json:
              schema:
                type: object
                required: [type, features]
                properties:
                  type: { type: string, enum: [FeatureCollection] }
                  truncated: { type: boolean, description: True when a response limit was reached }
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [Feature] }
                        id: { type: integer, format: int64 }
                        geometry: { type: object, description: Complete GeoJSON Polygon }
                        properties:
                          type: object
                          properties:
                            class: { type: string }
                            render_height: { type: number, description: Total height above ground in metres }
                            render_min_height: { type: number, description: Base above ground in metres }
                            height_source: { type: string, enum: [height, levels, default] }
        "400":
          description: Invalid or excessive bounding box
        "405":
          description: Method not allowed
  /api/v1/offline-labels:
    get:
      summary: Get local town and street labels for the tinyTiles map
      description: Labels are read from the locally loaded PBF data. They are intended for the current viewport and do not require an external font or tile service.
      parameters:
        - name: bbox
          in: query
          required: true
          description: Visible WGS84 bounds as minLon,minLat,maxLon,maxLat.
          schema: { type: string }
        - name: zoom
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 22 }
      responses:
        "200":
          description: Local labels for the requested viewport
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        lat: { type: number }
                        lon: { type: number }
                        kind: { type: string, enum: [place, road] }
        "400":
          description: Invalid bounding box
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tile-sources:
    get:
      summary: List built-in map-source presets
      responses:
        "200":
          description: Map-source presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TileSourcePreset"
  /api/v1/territories:
    get:
      summary: List territory layers loaded from the optional territories directory
      responses:
        "200":
          description: Loaded layers and their territory counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  layers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        territories: { type: integer, minimum: 0 }
  /api/v1/territories/{layer}:
    get:
      summary: Get one loaded territory layer as GeoJSON
      parameters:
        - name: layer
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Original GeoJSON FeatureCollection
          content:
            application/geo+json:
              schema: { type: object }
        "404":
          description: Unknown territory layer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/search:
    get:
      summary: Address and street search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
  /api/v1/route:
    post:
      summary: Route between two locations
      parameters:
        - name: format
          in: query
          required: false
          description: >-
            Response format. `json` (default) returns the regular response;
            `gpx` returns a GPX 1.1 download (waypoints, maneuvers as <rte>,
            road geometry as <trk>) for navigation devices and GPS apps;
            `geojson` returns a FeatureCollection with the route LineString and
            one Point per waypoint ([lon, lat]).
          schema: { type: string, enum: [json, gpx, geojson], default: json }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
            application/gpx+xml:
              schema: { type: string, format: binary }
            application/geo+json:
              schema: { type: object }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/trip/solve:
    post:
      summary: Solve a trip (multi-stop) optionally optimized (TSP) with dependencies
      parameters:
        - name: format
          in: query
          required: false
          description: >-
            Response format. `json` (default) returns the regular response;
            `gpx` returns a GPX 1.1 download (waypoints, maneuvers as <rte>,
            road geometry as <trk>) for navigation devices and GPS apps;
            `geojson` returns a FeatureCollection with the route LineString and
            one Point per waypoint ([lon, lat]).
          schema: { type: string, enum: [json, gpx, geojson], default: json }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripSolveRequest"
      responses:
        "200":
          description: Trip solution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSolveResponse"
            application/gpx+xml:
              schema: { type: string, format: binary }
            application/geo+json:
              schema: { type: object }
        "400":
          description: Bad request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/openapi.yaml:
    get:
      summary: OpenAPI spec
      responses:
        "200":
          description: YAML
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    WorkLocation:
      type: object
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90, default: 0 }
        lon: { type: number, minimum: -180, maximum: 180, default: 0 }
    WorkResource:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, minLength: 1, description: Nonblank and unique within resources }
        location: { $ref: '#/components/schemas/WorkLocation' }
        capacity: { type: number, minimum: 0, default: 0, description: Same scalar unit as job demand; zero accepts only zero demand }
        max_jobs: { type: integer, minimum: 0, default: 0, description: Zero means unlimited }
        skills: { type: array, items: { type: string } }
        properties: { type: object, additionalProperties: true }
    WorkJob:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, minLength: 1, description: Nonblank and unique within jobs }
        location: { $ref: '#/components/schemas/WorkLocation' }
        demand: { type: number, minimum: 0, default: 0 }
        priority: { type: integer, default: 0, description: Higher values assigned first; ties use ascending job ID }
        required_skills: { type: array, items: { type: string }, description: All skills required; exact case-sensitive matching }
        properties: { type: object, additionalProperties: true }
    WorkPlan:
      type: object
      required: [algorithm, distance_model, manifests, unassigned]
      properties:
        algorithm: { type: string, const: priority-greedy }
        distance_model: { type: string, const: great-circle-from-resource }
        manifests:
          type: array
          items:
            type: object
            required: [resource_id, job_ids, load, remaining_capacity]
            properties:
              resource_id: { type: string }
              job_ids: { type: array, items: { type: string }, description: 'Assignment order, not driving order' }
              load: { type: number, minimum: 0 }
              remaining_capacity: { type: number, minimum: 0 }
        unassigned:
          type: array
          items:
            type: object
            required: [job_id, reason]
            properties:
              job_id: { type: string }
              reason: { type: string, enum: [no_eligible_resource, capacity_exceeded] }
    Error:
      type: object
      properties:
        error: { type: string }
    OperationRecord:
      type: object
      required: [type, asset_code, status]
      properties:
        id: { type: string, readOnly: true }
        client_event_id: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]*$" }
        type: { type: string, enum: [pod, maintenance, check] }
        actor: { type: string, readOnly: true }
        asset_code: { type: string, maxLength: 160 }
        status: { type: string, maxLength: 80 }
        recipient: { type: string, maxLength: 240 }
        reference: { type: string, maxLength: 240 }
        technician: { type: string, maxLength: 240 }
        work_type: { type: string, maxLength: 240 }
        notes: { type: string, maxLength: 4096 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time, readOnly: true }
    Tags:
      type: object
      additionalProperties: { type: string }
    Coord:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
    Location:
      type: object
      properties:
        query: { type: string }
        lat: { type: number }
        lon: { type: number }
    ProWeights:
      type: object
      properties:
        left_turn: { type: number }
        right_turn: { type: number }
        u_turn: { type: number }
        crossing: { type: number }
        max_speed_kph: { type: number }
        vehicle_height_m: { type: number }
        vehicle_weight_t: { type: number }
    RouteOptions:
      type: object
      properties:
        engine:
          type: string
          enum: [astar, dijkstra, dijkstra-node]
          description: The experimental ch engine is unavailable and rejected.
        profile:
          type: string
          enum: [car, delivery, truck, travel, firefighting, emergency, thw, cycling, walking]
        objective:
          type: string
          enum: [distance, duration, economy]
        pro: { type: boolean }
        weights:
          $ref: "#/components/schemas/ProWeights"
    RouteRequest:
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/Location" }
        to: { $ref: "#/components/schemas/Location" }
        options: { $ref: "#/components/schemas/RouteOptions" }
    RoutePoint:
      type: object
      properties:
        input: { type: string }
        label: { type: string }
        lat: { type: number }
        lon: { type: number }
        node: { type: integer }
        snap_m: { type: number }
    RouteResponse:
      type: object
      properties:
        from: { $ref: "#/components/schemas/RoutePoint" }
        to: { $ref: "#/components/schemas/RoutePoint" }
        engine: { type: string }
        objective: { type: string }
        cost: { type: number }
        distance_m: { type: number }
        duration_s: { type: number }
        path:
          type: array
          items: { $ref: "#/components/schemas/Coord" }
        google_maps_url: { type: string }
        apple_maps_url: { type: string }
    SearchResult:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [address, street] }
        label: { type: string }
        lat: { type: number }
        lon: { type: number }
        tags: { $ref: "#/components/schemas/Tags" }
    TripStop:
      type: object
      properties:
        id: { type: string }
        location: { $ref: "#/components/schemas/Location" }
    Dependency:
      type: object
      properties:
        before: { type: string }
        after: { type: string }
    TripPlan:
      type: object
      properties:
        start: { $ref: "#/components/schemas/Location" }
        end: { $ref: "#/components/schemas/Location" }
        stops:
          type: array
          items: { $ref: "#/components/schemas/TripStop" }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/Dependency" }
        optimize: { type: boolean }
        loop: { type: boolean }
    TripSolveRequest:
      type: object
      properties:
        plan: { $ref: "#/components/schemas/TripPlan" }
        options: { $ref: "#/components/schemas/RouteOptions" }
    TripStopResolved:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        lat: { type: number }
        lon: { type: number }
        node: { type: integer }
        snap_m: { type: number }
    TripSolveResponse:
      type: object
      properties:
        engine: { type: string }
        objective: { type: string }
        order:
          type: array
          items: { type: string }
        stops:
          type: array
          items: { $ref: "#/components/schemas/TripStopResolved" }
        distance_m: { type: number }
        duration_s: { type: number }
        cost: { type: number }
        path:
          type: array
          items: { $ref: "#/components/schemas/Coord" }
        legs:
          type: array
          items: { $ref: "#/components/schemas/RouteResponse" }
        google_maps_url: { type: string }
        apple_maps_url: { type: string }
    Settings:
      type: object
      properties:
        map_display: { $ref: "#/components/schemas/MapDisplaySettings" }
        routing: { $ref: "#/components/schemas/RouteOptions" }
        tiles:
          type: object
          properties:
            cache_dir: { type: string }
            upstream: { type: string }
            user_agent: { type: string }
            map_type: { type: string, enum: [raster, raster-direct, vector, wms] }
            style_url: { type: string, format: uri-reference }
            wms_layers: { type: string }
            attribution: { type: string }
            max_zoom: { type: integer, minimum: 0, maximum: 22 }
            mem_cache_size: { type: integer, minimum: 0 }
    MapDisplaySettings:
      type: object
      properties:
        renderer: { type: string, enum: [micromap, maplibre], default: micromap }
        micromap:
          type: object
          properties:
            quality: { type: string, enum: [economy, balanced, sharp], default: balanced }
            view: { type: string, enum: [flat, perspective, steep], default: flat }
            buildings: { type: string, enum: [auto, canvas], default: auto }
            sky: { type: string, enum: [auto, off], default: auto }
            interaction: { type: string, enum: [full, simple], default: full }
    TileSourcePreset:
      type: object
      required: [id, label, map_type, attribution]
      properties:
        id: { type: string }
        label: { type: string }
        map_type: { type: string, enum: [raster, raster-direct, vector, wms] }
        upstream: { type: string }
        style_url: { type: string, format: uri-reference }
        wms_layers: { type: string }
        attribution: { type: string }
        max_zoom: { type: integer, minimum: 0, maximum: 22 }
    TinyTilesBuildRequest:
      type: object
      properties:
        min_zoom: { type: integer, minimum: 5, maximum: 14, default: 5 }
        max_zoom: { type: integer, minimum: 5, maximum: 14, default: 14 }
        postal_codes:
          type: boolean
          default: false
          description: Also extract OSM boundary=postal_code relations and publish a PLZ territory layer.
        postal_prefix_length:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: PLZ prefix length used when postal_codes is true.
    TinyTilesBuildStatus:
      type: object
      required: [state, phase, progress]
      properties:
        state: { type: string, enum: [idle, building, ready, failed] }
        phase:
          type: string
          enum: [idle, preparing, waterways, generating, importing, finalizing, activating, territories, processing, ready, failed]
          description: Public build phase; does not expose local paths or tinyTiles internals.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Monotonic overall build progress. During the importing phase it follows the completed tinyTiles import rows.
        message: { type: string }
        error: { type: string, description: Public, path-free failure message }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        artifact: { type: string, description: Artifact file name only }
        min_zoom: { type: integer }
        max_zoom: { type: integer }
        postal_codes: { type: boolean }
        postal_prefix_length: { type: integer, minimum: 1, maximum: 5 }
        territory_layer: { type: string, example: plz3 }
        territories: { type: integer, minimum: 0 }
        source_bytes: { type: integer, format: int64, minimum: 0, description: Size of the source PBF in bytes. }
        estimated_disk_bytes: { type: integer, format: int64, minimum: 0, description: Preflight estimate for the published artifact. }
        estimated_tile_count: { type: integer, format: int64, minimum: 0, description: Tile count estimated during tinySQL preflight. }
        generated_tiles: { type: integer, minimum: 0, description: Number of tiles generated from the PBF. }
        road_features: { type: integer, minimum: 0, description: Number of road features used by the generated map. }
        waterway_features: { type: integer, minimum: 0, description: Number of linear waterway features published in the local companion layer. }
        building_features: { type: integer, minimum: 0, description: Number of building footprints in the local companion layer. }
    TinyTilesWaterwayFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, enum: [FeatureCollection] }
        truncated: { type: boolean, description: True when a viewport result limit was reached. }
        features:
          type: array
          items:
            type: object
            required: [type, properties, geometry]
            properties:
              type: { type: string, enum: [Feature] }
              properties:
                type: object
                required: [class]
                properties:
                  class: { type: string, enum: [river, canal, stream, wadi, ditch, drain] }
                  name: { type: string }
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type: { type: string, enum: [LineString] }
                  coordinates:
                    type: array
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items: { type: number }
